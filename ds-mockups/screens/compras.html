<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>Compras — Finanzas Hogar</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6fd; --card: #ffffff; --fg: #1a1626; --primary: #7c3aed;
    --primary-light: #ede9f8; --muted: #f0eef9; --muted-fg: #6b6482;
    --border: #e2dff2; --destructive: #dc2626; --success: #16a34a; --amber: #d97706; --radius: 14px;
  }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; width: 390px; min-height: 844px; }
  .screen { padding: 16px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 14px; }
  .header { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .btn-sm { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; border: none; cursor: pointer; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-outline { background: var(--card); color: var(--fg); border: 1px solid var(--border); }
  .month-btn { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 500; color: var(--muted-fg); display: flex; align-items: center; gap: 4px; }

  /* Search bar */
  .search-row { display: flex; gap: 8px; align-items: center; }
  .search-wrap { flex: 1; position: relative; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted-fg); font-size: 13px; }
  .search-input { width: 100%; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); padding: 0 12px 0 30px; font-size: 13px; color: var(--fg); outline: none; }
  .search-input::placeholder { color: var(--muted-fg); }
  .export-btn { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 12px; color: var(--muted-fg); cursor: pointer; white-space: nowrap; }

  /* Layout: sidebar + list */
  .content-row { display: flex; gap: 12px; align-items: flex-start; }
  .filter-sidebar { width: 68px; shrink: 0; display: flex; flex-direction: column; gap: 2px; }
  .filter-item { display: flex; align-items: center; justify-content: center; padding: 10px 6px; border-radius: 10px; font-size: 11px; font-weight: 500; color: var(--muted-fg); cursor: pointer; position: relative; text-align: center; }
  .filter-item.active { background: var(--primary-light); color: var(--primary); }
  .filter-item.active::before { content: ''; position: absolute; left: 4px; top: 50%; transform: translateY(-50%); width: 2px; height: 16px; background: var(--primary); border-radius: 1px; }
  .filter-divider { height: 1px; background: var(--border); margin: 4px 0; }
  .filter-card-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }

  /* Purchase list */
  .purchase-list { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .purchase-item { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; border-bottom: 1px solid var(--border); }
  .purchase-item:last-child { border-bottom: none; }
  .purchase-type-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; shrink: 0; }
  .purchase-type-dot.one-time { background: #6366f1; }
  .purchase-type-dot.installment { background: var(--primary); }
  .purchase-body { flex: 1; min-width: 0; }
  .purchase-desc { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .purchase-meta { font-size: 11px; color: var(--muted-fg); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .tag-card { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 4px; }
  .purchase-amount-col { text-align: right; shrink: 0; }
  .purchase-amount { font-size: 13px; font-weight: 700; }
  .installment-badge { font-size: 10px; color: var(--muted-fg); margin-top: 2px; }
  .installment-progress { height: 3px; background: var(--muted); border-radius: 2px; overflow: hidden; margin-top: 5px; }
  .installment-fill { height: 100%; background: var(--primary); border-radius: 2px; }

  /* Bottom Nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; width: 390px; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; align-items: stretch; z-index: 50; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted-fg); font-size: 9px; font-weight: 400; position: relative; }
  .nav-item.active { color: var(--primary); font-weight: 600; }
  .nav-item.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 2px; background: var(--primary); border-radius: 1px; }
</style>
</head>
<body>
<div class="screen">
  <!-- Header -->
  <div class="header">
    <h1>Compras</h1>
    <div class="header-actions">
      <div class="month-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        jun 2026
      </div>
      <button class="btn-sm btn-primary">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nueva
      </button>
    </div>
  </div>

  <!-- Search + Export -->
  <div class="search-row">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="text" placeholder="Buscar gasto...">
    </div>
    <button class="btn-sm btn-outline">Buscar</button>
    <button class="export-btn">↓ CSV</button>
  </div>

  <!-- Sidebar + List -->
  <div class="content-row">
    <!-- Filter sidebar -->
    <div class="filter-sidebar">
      <div class="filter-item active">Todos</div>
      <div class="filter-item">Compras</div>
      <div class="filter-item">Cuotas</div>
      <div class="filter-divider"></div>
      <div class="filter-item">
        <div class="filter-card-icon" style="background:#6366f120;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        </div>
      </div>
      <div class="filter-item">
        <div class="filter-card-icon" style="background:#2563eb20;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        </div>
      </div>
    </div>

    <!-- Purchase list -->
    <div class="purchase-list">
      <div class="card">
        <div class="purchase-item">
          <div class="purchase-type-dot one-time"></div>
          <div class="purchase-body">
            <div class="purchase-desc">Supermercado Lider</div>
            <div class="purchase-meta">
              5 jun
              <span class="tag-card" style="background:#6366f120;color:#6366f1;">Visa ···· 1234</span>
            </div>
          </div>
          <div class="purchase-amount-col">
            <div class="purchase-amount">$187.500</div>
          </div>
        </div>

        <div class="purchase-item">
          <div class="purchase-type-dot one-time"></div>
          <div class="purchase-body">
            <div class="purchase-desc">Farmacia Cruz Verde</div>
            <div class="purchase-meta">4 jun</div>
          </div>
          <div class="purchase-amount-col">
            <div class="purchase-amount">$42.000</div>
          </div>
        </div>

        <div class="purchase-item">
          <div class="purchase-type-dot one-time"></div>
          <div class="purchase-body">
            <div class="purchase-desc">Bencina Shell</div>
            <div class="purchase-meta">3 jun</div>
          </div>
          <div class="purchase-amount-col">
            <div class="purchase-amount">$65.000</div>
          </div>
        </div>

        <div class="purchase-item">
          <div class="purchase-type-dot installment"></div>
          <div class="purchase-body">
            <div class="purchase-desc">Notebook Samsung</div>
            <div class="purchase-meta">Cuota 3 de 12</div>
            <div class="installment-progress"><div class="installment-fill" style="width:25%;"></div></div>
          </div>
          <div class="purchase-amount-col">
            <div class="purchase-amount">$89.990</div>
            <div class="installment-badge">cuota</div>
          </div>
        </div>

        <div class="purchase-item">
          <div class="purchase-type-dot installment"></div>
          <div class="purchase-body">
            <div class="purchase-desc">Smart TV 55"</div>
            <div class="purchase-meta">Cuota 8 de 12</div>
            <div class="installment-progress"><div class="installment-fill" style="width:67%;"></div></div>
          </div>
          <div class="purchase-amount-col">
            <div class="purchase-amount">$45.000</div>
            <div class="installment-badge">cuota</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a href="#" class="nav-item"><span style="font-size:20px;">⌂</span><span>Inicio</span></a>
  <a href="#" class="nav-item"><span style="font-size:20px;">📋</span><span>Fijos</span></a>
  <a href="#" class="nav-item active"><span style="font-size:20px;">🛒</span><span>Compras</span></a>
  <a href="#" class="nav-item"><span style="font-size:20px;">📊</span><span>Resumen</span></a>
  <a href="#" class="nav-item"><span style="font-size:20px;">📥</span><span>Pendientes</span></a>
  <a href="#" class="nav-item"><span style="font-size:20px;">⚙</span><span>Ajustes</span></a>
</nav>
</body>
</html>
